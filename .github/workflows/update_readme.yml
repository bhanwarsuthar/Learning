name: CI - Stats and Resume Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install lcov and bc
      run: sudo apt-get update && sudo apt-get install -y lcov bc

    - name: Install poppler-utils
      run: sudo apt-get install -y poppler-utils
    
    - name: Run tests with coverage
      run: flutter test --coverage

    - name: Generate HTML coverage report
      run: genhtml coverage/lcov.info -o coverage/html

    - name: Build full resume page from PDF
      run: |
        mkdir -p docs
        pdftoppm -png -singlefile resume/Bhanwar_Suthar_Resume.pdf docs/resume

        cat > docs/index.html << 'EOF'
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Bhanwar Suthar - Resume</title>
          <style>
            body { margin: 0; background: #f3f4f6; display: flex; justify-content: center; }
            img { width: min(100%, 950px); height: auto; display: block; }
          </style>
        </head>
        <body>
          <img src="./resume.png" alt="Bhanwar Suthar full resume" />
        </body>
        </html>
        EOF

    - name: Get commit count
      id: commit_count
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

    - name: Get coverage percentage
      id: coverage
      run: |
        COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -m 1 "lines.*:" | sed -e 's/.*lines.*: \([0-9.]*\)%.*/\1/' || echo "0")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

    - name: Get latest commit info
      id: commit_info
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_DATE=$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S UTC')
        echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

    - name: Update README stats section
      env:
        COMMIT_COUNT: ${{ steps.commit_count.outputs.count }}
        COVERAGE_PERCENT: ${{ steps.coverage.outputs.percentage }}
        COMMIT_SHA: ${{ steps.commit_info.outputs.sha }}
        COMMIT_DATE: ${{ steps.commit_info.outputs.date }}
      run: |
        if (( $(echo "$COVERAGE_PERCENT >= 80" | bc -l) )); then
            COVERAGE_STATUS="✅ Excellent"
        elif (( $(echo "$COVERAGE_PERCENT >= 60" | bc -l) )); then
            COVERAGE_STATUS="⚠️ Good"
        else
            COVERAGE_STATUS="❌ Needs Improvement"
        fi
        export COVERAGE_STATUS
        python3 << 'PYEOF'
        import re
        import os

        commit_count = os.environ.get('COMMIT_COUNT', '0')
        coverage_percent = os.environ.get('COVERAGE_PERCENT', '0')
        commit_sha = os.environ.get('COMMIT_SHA', 'unknown')
        commit_date = os.environ.get('COMMIT_DATE', 'unknown')
        coverage_status = os.environ.get('COVERAGE_STATUS', '❌ Needs Improvement')

        with open('README.md', 'r', encoding='utf-8') as f:
            content = f.read()

        stats_lines = [
            "## 📊 Project Statistics",
            "",
            "| Metric | Value | Status |",
            "|--------|-------|--------|",
            f"| **Total Commits** | {commit_count} | ✅ Active |",
            f"| **Code Coverage** | {coverage_percent}% | {coverage_status} |",
            f"| **Last Updated** | {commit_date} | 🔄 Auto-updated |",
            f"| **Latest Commit** | `{commit_sha}` | 📝 |",
            "",
            "> **Note:** These statistics are automatically updated on every commit via GitHub Actions. View live dashboard at: [GitHub Pages](https://bhanwarsuthar.github.io/Learning/)",
            "",
            "---",
            ""
        ]
        stats_section = "\n".join(stats_lines)

        if re.search(r'## 📊 Project Statistics', content):
            pattern = r'## 📊 Project Statistics.*?^---\s*\n'
            content = re.sub(pattern, stats_section, content, flags=re.DOTALL | re.MULTILINE)
        else:
            heading = re.search(r'(^# .*?\n\n)', content, re.MULTILINE)
            if heading:
                content = content[:heading.end(1)] + stats_section + content[heading.end(1):]
            else:
                content = stats_section + content

        with open('README.md', 'w', encoding='utf-8') as f:
            f.write(content)
        PYEOF

        cp docs/index.html resume/index.html
        
        cat > index.html << 'EOF'
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Bhanwar Suthar - Resume</title>
          <style>
            body { margin: 0; background: #f3f4f6; display: flex; justify-content: center; }
            img { width: min(100%, 950px); height: auto; display: block; }
          </style>
        </head>
        <body>
          <img src="./docs/resume.png" alt="Bhanwar Suthar full resume" />
        </body>
        </html>
        EOF
    
    - name: Commit changes
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md index.html docs/index.html docs/resume.png resume/index.html resume/Bhanwar_Suthar_Resume.pdf
        if ! git diff --staged --quiet; then
          git commit -m "📊 Auto-update: stats and resume artifacts [skip ci]"
          git push origin HEAD:${{ github.ref }}
        else
          echo "No changes to commit"
        fi
