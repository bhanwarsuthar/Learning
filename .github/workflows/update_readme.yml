name: Update README with Stats

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install lcov and bc
        run: sudo apt-get update && sudo apt-get install -y lcov bc

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html

      - name: Get commit count
        id: commit_count
        run: |
          echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Get coverage percentage
        id: coverage
        run: |
          if [ -f coverage/lcov_cleaned.info ]; then
            COVERAGE=$(lcov --summary coverage/lcov_cleaned.info 2>/dev/null | grep -m 1 "lines.*:" | sed -e 's/.*lines.*: \([0-9.]*\)%.*/\1/' || echo "0")
          else
            COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -m 1 "lines.*:" | sed -e 's/.*lines.*: \([0-9.]*\)%.*/\1/' || echo "0")
          fi
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Get latest commit info
        id: commit_info
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Update README.md
        env:
          COMMIT_COUNT: ${{ steps.commit_count.outputs.count }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.percentage }}
          COMMIT_SHA: ${{ steps.commit_info.outputs.sha }}
          COMMIT_DATE: ${{ steps.commit_info.outputs.date }}
        run: |
          if (( $(echo "$COVERAGE_PERCENT >= 80" | bc -l) )); then
              COVERAGE_STATUS="✅ Excellent"
          elif (( $(echo "$COVERAGE_PERCENT >= 60" | bc -l) )); then
              COVERAGE_STATUS="⚠️ Good"
          else
              COVERAGE_STATUS="❌ Needs Improvement"
          fi
          export COVERAGE_STATUS

          python3 << 'PYEOF'
          import re
          import os

          commit_count = os.environ.get("COMMIT_COUNT", "0")
          coverage_percent = os.environ.get("COVERAGE_PERCENT", "0")
          commit_sha = os.environ.get("COMMIT_SHA", "unknown")
          commit_date = os.environ.get("COMMIT_DATE", "unknown")
          coverage_status = os.environ.get("COVERAGE_STATUS", "❌ Needs Improvement")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # =============================
          # Resume Details Section
          # =============================
          resume_sections = {
              "👨‍💻 Professional Summary": [
                  "Senior Android Developer",
                  "8+ Years Mobile Application Development",
                  "Cross-Platform (Flutter & React Native)"
              ],
              "🏗 Architecture": [
                  "Clean Architecture",
                  "MVVM Pattern",
                  "Modular Architecture",
                  "Jetpack Compose",
                  "Android XML UI"
              ],
              "📱 Mobile Stack": [
                  "Kotlin",
                  "Java",
                  "Android SDK",
                  "Jetpack Components",
                  "Flutter",
                  "React Native"
              ],
              "🔗 Backend & APIs": [
                  "REST API Integration",
                  "Node.js",
                  "Express.js",
                  "MySQL",
                  "Sequelize"
              ],
              "🧪 Testing & Quality": [
                  "Unit Testing",
                  "Instrumented Testing",
                  "Performance Optimization",
                  "Reliability Engineering"
              ],
              "🚀 DevOps & CI/CD": [
                  "GitHub Actions",
                  "Automated Builds",
                  "CI/CD Pipelines",
                  "Coverage Reporting (lcov)"
              ],
              "🎓 Education": [
                  "Diploma in Mobile Computing (2017)",
                  "Electronics & Communications (2012–2016)"
              ],
              "🌍 Languages": [
                  "English – Professional",
                  "Hindi – Fluent"
              ]
          }

          # Detect OneSignal automatically
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  if "onesignal" in f.read().lower():
                      resume_sections.setdefault("🔔 Integrations", []).append("OneSignal Notification")

          resume_lines = ["## 🧾 Resume Details", ""]

          for section, items in resume_sections.items():
              resume_lines.append(f"### {section}")
              resume_lines.append("")
              for item in items:
                  resume_lines.append(f"- {item}")
              resume_lines.append("")

          resume_lines.append("---")
          resume_lines.append("")
          resume_section = "\n".join(resume_lines)

          # Replace or insert Resume Section
          if re.search(r"## 🧾 Resume Details", content):
              pattern = r"## 🧾 Resume Details.*?^---\s*\n"
              content = re.sub(pattern, resume_section, content, flags=re.DOTALL | re.MULTILINE)
          else:
              title_match = re.search(r"(^# .*?\n)", content, re.MULTILINE)
              if title_match:
                  content = content[:title_match.end(1)] + "\n" + resume_section + content[title_match.end(1):]
              else:
                  content = resume_section + content

          # =============================
          # Project Statistics Section
          # =============================
          stats_lines = [
              "## 📊 Project Statistics",
              "",
              "| Metric | Value | Status |",
              "|--------|-------|--------|",
              f"| **Total Commits** | {commit_count} | ✅ Active |",
              f"| **Code Coverage** | {coverage_percent}% | {coverage_status} |",
              f"| **Last Updated** | {commit_date} | 🔄 Auto-updated |",
              f"| **Latest Commit** | `{commit_sha}` | 📝 |",
              "",
              "---",
              ""
          ]

          stats_section = "\n".join(stats_lines)

          if re.search(r"## 📊 Project Statistics", content):
              pattern = r"## 📊 Project Statistics.*?^---\s*\n"
              content = re.sub(pattern, stats_section, content, flags=re.DOTALL | re.MULTILINE)
          else:
              content += "\n" + stats_section

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print("README updated successfully")
          PYEOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "📊 Auto-update README (Commits: ${{ steps.commit_count.outputs.count }}, Coverage: ${{ steps.coverage.outputs.percentage }}%) [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi