name: Resume CI/CD

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'resume/**'
      - '.github/workflows/resume_cicd.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'resume/**'
      - '.github/workflows/resume_cicd.yml'
  workflow_dispatch:

jobs:
  build-resume:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Build HTML resume
        run: |
          pandoc resume/resume.md \
            --standalone \
            --css resume.css \
            -o resume/index.html

      - name: Build PDF resume
        run: |
          pandoc resume/resume.md \
            --standalone \
            --css resume.css \
            --pdf-engine=wkhtmltopdf \
            -o resume/Bhanwar_Suthar_Resume.pdf

      - name: Upload resume artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifact
          path: |
            resume/index.html
            resume/Bhanwar_Suthar_Resume.pdf

      - name: Commit generated resume files
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') && github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add resume/index.html resume/Bhanwar_Suthar_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "chore(resume): auto-generate resume artifacts [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No generated resume changes to commit"
          fi
