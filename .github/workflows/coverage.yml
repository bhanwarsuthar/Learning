# This workflow is replaced by coverage_and_stats.yml
# Kept for backward compatibility - will be removed in future
name: Generate Coverage Report (Legacy)

on:
  workflow_dispatch:  # Only manual trigger

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.9.2'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov
    
    - name: Run tests with coverage
      run: flutter test --coverage
    
    - name: Clean coverage data
      run: |
        lcov --remove coverage/lcov.info \
          '**/*.g.dart' \
          '**/*.freezed.dart' \
          '**/generated/**' \
          '**/l10n/**' \
          '**/firebase_options.dart' \
          -o coverage/lcov_cleaned.info || cp coverage/lcov.info coverage/lcov_cleaned.info
    
    - name: Generate HTML coverage report
      run: genhtml coverage/lcov_cleaned.info -o coverage/html
