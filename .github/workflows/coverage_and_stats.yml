name: Generate Coverage and Update Stats

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  coverage-and-stats:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for commit count
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.9.2'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov
    
    - name: Run tests with coverage
      run: flutter test --coverage
    
    - name: Clean coverage data
      run: |
        lcov --remove coverage/lcov.info \
          '**/*.g.dart' \
          '**/*.freezed.dart' \
          '**/generated/**' \
          '**/l10n/**' \
          '**/firebase_options.dart' \
          -o coverage/lcov_cleaned.info || cp coverage/lcov.info coverage/lcov_cleaned.info
    
    - name: Generate HTML coverage report
      run: genhtml coverage/lcov_cleaned.info -o coverage/html
    
    - name: Get commit count
      id: commit_count
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        echo "Total commits: $COMMIT_COUNT"
    
    - name: Get coverage percentage
      id: coverage
      run: |
        if [ -f coverage/lcov_cleaned.info ]; then
          COVERAGE=$(lcov --summary coverage/lcov_cleaned.info 2>/dev/null | grep -m 1 "lines.*:" | sed -e 's/.*lines.*: \([0-9.]*\)%.*/\1/' || echo "0")
        else
          COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -m 1 "lines.*:" | sed -e 's/.*lines.*: \([0-9.]*\)%.*/\1/' || echo "0")
        fi
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"
    
    - name: Get latest commit info
      id: commit_info
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=%B)
        COMMIT_DATE=$(git log -1 --pretty=%cd --date=format:'%Y-%m-%d %H:%M:%S')
        COMMIT_AUTHOR=$(git log -1 --pretty=%an)
        echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT
        echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
    
    - name: Create docs directory
      run: |
        mkdir -p docs/coverage
        cp -r coverage/html/* docs/coverage/
        cp coverage_viewer.html docs/coverage_viewer.html || true
    
    - name: Generate dynamic index.html
      run: |
        cat > docs/index.html << EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Learning Flutter App - Dashboard</title>
            <style>
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }
                
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    padding: 20px;
                }
                
                .container {
                    max-width: 1400px;
                    margin: 0 auto;
                }
                
                .header {
                    background: white;
                    border-radius: 12px;
                    padding: 40px;
                    margin-bottom: 30px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                    text-align: center;
                }
                
                .header h1 {
                    font-size: 3em;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    margin-bottom: 10px;
                }
                
                .header p {
                    color: #6c757d;
                    font-size: 1.2em;
                }
                
                .stats-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 20px;
                    margin-bottom: 30px;
                }
                
                .stat-card {
                    background: white;
                    border-radius: 12px;
                    padding: 30px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                    text-align: center;
                    transition: transform 0.3s;
                }
                
                .stat-card:hover {
                    transform: translateY(-5px);
                }
                
                .stat-card h3 {
                    color: #6c757d;
                    font-size: 1em;
                    margin-bottom: 15px;
                    text-transform: uppercase;
                    letter-spacing: 1px;
                }
                
                .stat-value {
                    font-size: 3.5em;
                    font-weight: bold;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    margin-bottom: 10px;
                }
                
                .stat-label {
                    color: #6c757d;
                    font-size: 0.9em;
                }
                
                .coverage-badge {
                    display: inline-block;
                    padding: 8px 16px;
                    border-radius: 20px;
                    font-weight: 600;
                    margin-top: 10px;
                }
                
                .coverage-excellent {
                    background: #d4edda;
                    color: #155724;
                }
                
                .coverage-good {
                    background: #fff3cd;
                    color: #856404;
                }
                
                .coverage-poor {
                    background: #f8d7da;
                    color: #721c24;
                }
                
                .coverage-container {
                    background: white;
                    border-radius: 12px;
                    padding: 30px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                    margin-bottom: 30px;
                }
                
                .coverage-container h2 {
                    margin-bottom: 20px;
                    color: #333;
                }
                
                .coverage-iframe {
                    width: 100%;
                    height: 80vh;
                    border: 2px solid #e0e0e0;
                    border-radius: 8px;
                }
                
                .actions {
                    display: flex;
                    gap: 15px;
                    justify-content: center;
                    flex-wrap: wrap;
                    margin-top: 20px;
                }
                
                .btn {
                    padding: 12px 24px;
                    border: none;
                    border-radius: 6px;
                    font-size: 16px;
                    cursor: pointer;
                    transition: all 0.3s;
                    text-decoration: none;
                    display: inline-block;
                    font-weight: 600;
                    color: white;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                }
                
                .btn:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
                }
                
                .commit-info {
                    background: white;
                    border-radius: 12px;
                    padding: 20px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                    margin-bottom: 20px;
                }
                
                .commit-info h3 {
                    color: #667eea;
                    margin-bottom: 15px;
                }
                
                .commit-details {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                    gap: 15px;
                }
                
                .commit-detail {
                    padding: 10px;
                    background: #f8f9fa;
                    border-radius: 6px;
                }
                
                .commit-detail strong {
                    color: #667eea;
                    display: block;
                    margin-bottom: 5px;
                }
                
                .footer {
                    text-align: center;
                    color: white;
                    padding: 20px;
                    margin-top: 30px;
                }
                
                @media (max-width: 768px) {
                    .header h1 {
                        font-size: 2em;
                    }
                    .stat-value {
                        font-size: 2.5em;
                    }
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>📱 Learning Flutter App</h1>
                    <p>MVVM Architecture with Provider & HTTP</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>📊 Total Commits</h3>
                        <div class="stat-value" id="commitCount">${{ steps.commit_count.outputs.count }}</div>
                        <div class="stat-label">All time commits</div>
                    </div>
                    
                    <div class="stat-card">
                        <h3>✅ Code Coverage</h3>
                        <div class="stat-value" id="coveragePercent">${{ steps.coverage.outputs.percentage }}%</div>
                        <div class="stat-label">Line coverage</div>
                        <span class="coverage-badge" id="coverageBadge"></span>
                    </div>
                    
                    <div class="stat-card">
                        <h3>🔄 Last Updated</h3>
                        <div class="stat-value" style="font-size: 1.5em;" id="lastUpdate">${{ steps.commit_info.outputs.date }}</div>
                        <div class="stat-label">Latest commit</div>
                    </div>
                </div>
                
                <div class="commit-info">
                    <h3>📝 Latest Commit Information</h3>
                    <div class="commit-details">
                        <div class="commit-detail">
                            <strong>Commit SHA:</strong>
                            <span>${{ steps.commit_info.outputs.sha }}</span>
                        </div>
                        <div class="commit-detail">
                            <strong>Author:</strong>
                            <span>${{ steps.commit_info.outputs.author }}</span>
                        </div>
                        <div class="commit-detail">
                            <strong>Date:</strong>
                            <span>${{ steps.commit_info.outputs.date }}</span>
                        </div>
                        <div class="commit-detail" style="grid-column: 1 / -1;">
                            <strong>Message:</strong>
                            <span>${{ steps.commit_info.outputs.message }}</span>
                        </div>
                    </div>
                </div>
                
                <div class="coverage-container">
                    <h2>📊 Detailed Code Coverage Report</h2>
                    <iframe src="coverage/html/index.html" class="coverage-iframe" title="Coverage Report"></iframe>
                    <div class="actions">
                        <a href="coverage_viewer.html" class="btn">🔄 Interactive Coverage Viewer</a>
                        <a href="https://github.com/bhanwarsuthar/Learning" target="_blank" class="btn">📂 View Repository</a>
                    </div>
                </div>
                
                <div class="footer">
                    <p>Auto-generated on: <span id="generatedTime"></span></p>
                    <p>This page updates automatically on every commit</p>
                </div>
            </div>
            
            <script>
                // Set coverage badge color based on percentage
                const coverage = parseFloat('${{ steps.coverage.outputs.percentage }}');
                const badge = document.getElementById('coverageBadge');
                const badgeEl = document.getElementById('coverageBadge');
                
                if (coverage >= 80) {
                    badgeEl.className = 'coverage-badge coverage-excellent';
                    badgeEl.textContent = 'Excellent';
                } else if (coverage >= 60) {
                    badgeEl.className = 'coverage-badge coverage-good';
                    badgeEl.textContent = 'Good';
                } else {
                    badgeEl.className = 'coverage-badge coverage-poor';
                    badgeEl.textContent = 'Needs Improvement';
                }
                
                // Set generated time
                document.getElementById('generatedTime').textContent = new Date().toLocaleString();
                
                // Format commit count with commas
                const commitCount = '${{ steps.commit_count.outputs.count }}';
                if (commitCount) {
                    document.getElementById('commitCount').textContent = parseInt(commitCount).toLocaleString();
                }
            </script>
        </body>
        </html>
        EOF
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        keep_files: false
